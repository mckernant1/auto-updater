name: Release and Trigger Homebrew Bottle Build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Trigger Homebrew Tap Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: mckernant1/homebrew-tap
          event-type: build-bottle
          client-payload: '{"formula": "auto-updater", "tag": "${{ github.ref_name }}"}'
