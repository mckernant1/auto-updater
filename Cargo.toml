[package]
name = "auto-updater"
version = "0.2.6"
authors = ["Tom McKernan <tmeaglei@gmail.com>"]
edition = "2024"

build = "build.rs"

[build-dependencies]
clap = {version = "4.6.9", features = ["derive", "color"]}
clap_complete = "4.6.12"
chrono = {version = "0.4.45", features = ["serde"]}
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
color-eyre = "0.6.5"

[dependencies]
clap = {version = "4.6.9", features = ["derive", "color"]}
chrono = {version = "0.4.45", features = ["serde"]}
